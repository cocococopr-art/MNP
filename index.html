<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>MNP予約番号 発行方法一覧</title>
<!-- Favicon / App Icon -->
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">

<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#102a43">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MNP一覧">
<style>
:root{
  --navy:#0e2238;
  --navy2:#173c5f;
  --blue:#2f78a8;
  --sky:#eaf4fb;
  --bg:#f3f6f9;
  --card:rgba(255,255,255,.94);
  --text:#172033;
  --muted:#6b7b8d;
  --line:#dfe8ef;
  --green:#158466;
  --warn-bg:#fff8e7;
  --warn:#7a5800;
  --imp-bg:#fff0f3;
  --imp:#9b2839;
  --shadow:0 18px 48px rgba(14,34,56,.10);
  --shadow-soft:0 8px 24px rgba(14,34,56,.07);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%,rgba(47,120,168,.10),transparent 34%),
    radial-gradient(circle at 100% 18%,rgba(84,180,190,.08),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.65;
}
button,input{font:inherit}
button{cursor:pointer}
.hero{
  position:relative;
  overflow:hidden;
  color:#fff;
  padding:46px 18px 40px;
  background:
    linear-gradient(135deg,rgba(11,31,50,.98),rgba(34,91,132,.94)),
    #102a43;
}
.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.hero::before{
  width:360px;height:360px;
  right:-120px;top:-160px;
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 67%);
}
.hero::after{
  width:280px;height:280px;
  left:-130px;bottom:-190px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 0 34px rgba(255,255,255,.03),0 0 0 68px rgba(255,255,255,.02);
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:auto}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.16em;
  opacity:.82;
}
.eyebrow::before{
  content:"";
  width:8px;height:8px;border-radius:50%;
  background:#7bd5ca;
  box-shadow:0 0 0 6px rgba(123,213,202,.12);
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  font-size:11px;
  font-weight:700;
}
.hero-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:30px;
}
h1{
  font-size:clamp(31px,7vw,52px);
  line-height:1.12;
  letter-spacing:-.04em;
  margin:0 0 13px;
  max-width:760px;
}
.lead{
  margin:0;
  max-width:760px;
  font-size:16px;
  color:rgba(255,255,255,.82);
}
.hero-stat{
  min-width:180px;
  padding:18px 20px;
  border-radius:20px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.hero-stat strong{
  display:block;
  font-size:28px;
  line-height:1;
  margin-bottom:6px;
}
.hero-stat span{font-size:11px;color:rgba(255,255,255,.72)}
.search-area{
  position:sticky;
  top:0;
  z-index:30;
  padding:12px;
  background:rgba(243,246,249,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(214,224,233,.88);
}
.search-row{
  max-width:1120px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
}
.search{position:relative}
.search input{
  width:100%;
  height:56px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.96);
  border-radius:17px;
  padding:0 48px 0 48px;
  font-size:16px;
  outline:none;
  box-shadow:0 7px 22px rgba(14,34,56,.06);
  transition:.2s ease;
}
.search input:focus{
  border-color:#70a8cc;
  box-shadow:0 0 0 5px rgba(47,120,168,.12),0 12px 28px rgba(14,34,56,.08);
  transform:translateY(-1px);
}
.search svg{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:21px;
  color:#6f8193;
}
.clear{
  display:none;
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  font-size:24px;
  color:#7a8795;
  padding:8px 10px;
}
.count{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
}
main{max-width:1120px;margin:auto;padding:22px 14px 68px}
.toolbar{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
  margin-bottom:15px;
}
.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:rgba(255,255,255,.92);
  border-radius:999px;
  padding:9px 14px;
  color:#526275;
  font-size:13px;
  box-shadow:0 4px 14px rgba(14,34,56,.04);
  transition:.2s ease;
}
.chip:hover{transform:translateY(-1px);border-color:#abc8dc}
.chip.active{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;
  border-color:transparent;
  box-shadow:0 8px 18px rgba(23,60,95,.20);
}
.sync{
  flex:0 0 auto;
  font-size:11px;
  color:var(--muted);
  margin:9px 0 0;
  white-space:nowrap;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}
.card{
  position:relative;
  background:var(--card);
  border:1px solid rgba(218,228,236,.92);
  border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
  overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:4px;
  background:linear-gradient(180deg,#2f78a8,#65b6bb);
  opacity:.9;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
  border-color:#c8d9e5;
}
.card-head{
  display:flex;
  align-items:center;
  gap:14px;
  padding:18px 19px 16px 21px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(248,251,253,.95),rgba(255,255,255,.82));
}
.logo-wrap{
  width:56px;
  height:56px;
  flex:0 0 56px;
  border-radius:17px;
  background:#fff;
  border:1px solid var(--line);
  overflow:hidden;
  box-shadow:0 6px 18px rgba(14,34,56,.07);
}

.logo{
  display:block;
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
  object-fit:cover;
  border-radius:inherit;
}
.logo-fallback{
  font-weight:900;
  color:var(--blue);
  font-size:18px;
  letter-spacing:-.05em;
}
.title-area{min-width:0;flex:1}
.carrier{
  font-size:21px;
  line-height:1.22;
  margin:0;
  font-weight:850;
  letter-spacing:-.025em;
  overflow-wrap:anywhere;
}
.category{
  display:inline-flex;
  align-items:center;
  margin-top:6px;
  padding:4px 9px;
  border-radius:999px;
  background:linear-gradient(135deg,#edf6fb,#e5f1f8);
  color:#245b84;
  font-size:10px;
  font-weight:800;
  letter-spacing:.02em;
}
.card-actions{display:flex;gap:7px}
.expand{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:8px 11px;
  color:#40566b;
  font-size:12px;
  font-weight:800;
  box-shadow:0 4px 12px rgba(14,34,56,.05);
  transition:.2s ease;
}
.expand:hover{border-color:#9fc0d5;color:#1f5f91}
.card.open .expand{background:var(--navy);color:#fff;border-color:var(--navy)}
.card-body{padding:17px 19px 20px 21px}
.summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}
.summary-box{
  position:relative;
  background:linear-gradient(180deg,#f9fbfc,#f5f8fa);
  border:1px solid #e6edf3;
  border-radius:15px;
  padding:13px 13px 12px;
  min-height:94px;
}
.summary-box::after{
  content:"";
  position:absolute;
  inset:auto 12px 0 12px;
  height:2px;
  background:linear-gradient(90deg,rgba(47,120,168,.2),transparent);
}
.summary-label{
  font-size:10px;
  font-weight:900;
  color:#587087;
  margin-bottom:5px;
  letter-spacing:.04em;
}
.summary-text{font-size:14px;line-height:1.6}
.summary-box.is-primary{
  background:linear-gradient(145deg,#eef7fc,#ffffff);
  border-color:#bfd8e8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 7px 18px rgba(32,91,132,.08);
}
.summary-box.is-primary .summary-label{
  color:#153f61;
  font-size:12px;
  letter-spacing:.06em;
}
.summary-box.is-primary .summary-text{
  color:#102a43;
  font-size:16px;
  line-height:1.5;
  font-weight:800;
}
.summary-box.is-method::before,
.summary-box.is-contact::before{
  position:absolute;
  top:11px;
  right:12px;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#dceefa;
  color:#1f638f;
  font-size:14px;
  font-weight:900;
}
.summary-box.is-method::before{content:"→";}
.summary-box.is-contact::before{content:"☎";}
.detail{
  display:none;
  margin-top:18px;
  border-top:1px dashed var(--line);
  padding-top:17px;
}
.card.open .detail{display:block;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.section{margin:0 0 18px}
.section:last-child{margin-bottom:0}
.section-title{
  font-size:14px;
  margin:0 0 9px;
  color:#244d6d;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900;
}
.section-title::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:#4f9abb;
  box-shadow:0 0 0 5px rgba(79,154,187,.11);
}
.rich{font-size:14px}
.rich h4{
  font-size:12px;
  margin:13px 0 8px;
  color:#274e6b;
  text-transform:none;
  letter-spacing:.02em;
}
.rich ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rich li{position:relative;padding-left:25px}
.rich li::before{
  content:"✓";
  position:absolute;
  left:0;
  top:0;
  color:var(--green);
  font-weight:900;
  width:18px;height:18px;
  border-radius:50%;
  background:rgba(21,132,102,.09);
  display:grid;
  place-items:center;
  font-size:11px;
}
.rich p{margin:7px 0}
.notice,.important{
  position:relative;
  border-radius:14px;
  padding:13px 14px 13px 16px;
  margin-top:12px;
  font-size:13px;
}
.notice::before,.important::before{
  content:"";
  position:absolute;
  left:0;top:10px;bottom:10px;
  width:4px;border-radius:4px;
}
.notice{
  background:var(--warn-bg);
  border:1px solid #f0dda0;
  color:#654800;
}
.notice::before{background:#e4b64a}
.important{
  background:var(--imp-bg);
  border:1px solid #efc2c8;
  color:#79202b;
}
.important::before{background:#d96578}
.notice b,.important b{
  display:block;
  font-size:10px;
  margin-bottom:4px;
  letter-spacing:.08em;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  margin-top:17px;
  padding-top:14px;
  border-top:1px dashed var(--line);
  font-size:11px;
  color:var(--muted);
}
.official{
  margin-left:auto;
  color:#fff;
  text-decoration:none;
  font-weight:800;
  background:linear-gradient(135deg,#285f8b,#347fa8);
  padding:8px 11px;
  border-radius:10px;
  box-shadow:0 6px 14px rgba(40,95,139,.16);
}
.empty,.error{
  display:none;
  background:rgba(255,255,255,.94);
  border-radius:18px;
  padding:30px;
  text-align:center;
  border:1px dashed #cbd5df;
  color:#66758a;
}
.error{
  color:#8f2431;
  background:#fff0f2;
  border-style:solid;
  margin-bottom:14px;
}
mark{
  background:#fff0a8;
  border-radius:4px;
  padding:0 2px;
}
footer{
  text-align:center;
  padding:30px 18px;
  color:#7a8795;
  font-size:11px;
}
@media(max-width:820px){
  .hero-grid{grid-template-columns:1fr}
  .hero-stat{display:none}
  .grid{grid-template-columns:1fr}
}
@media(max-width:620px){
  .hero{padding:30px 16px 26px}
  .hero-top{margin-bottom:15px}
  .hero-badge{display:none}
  .lead{font-size:13px}
  .search-area{padding:10px}
  .search-row{grid-template-columns:1fr}
  .count{display:none}
  main{padding:15px 10px 50px}
  .toolbar{display:block}
  .sync{margin:7px 2px 13px}
  .card-head{padding:14px 14px 13px 17px;gap:11px}
  .logo-wrap{width:48px;height:48px;flex-basis:48px;border-radius:14px}
  .logo{width:100%;height:100%;object-fit:cover;border-radius:inherit}
  .carrier{font-size:18px}
  .card-body{padding:14px 14px 17px 17px}
  .summary-grid{grid-template-columns:1fr}
  .summary-box{min-height:auto;padding:12px 13px}
  .summary-box.is-primary .summary-label{font-size:11px}
  .summary-box.is-primary .summary-text{font-size:15px;padding-right:28px}
  .card-actions{align-self:flex-start}
  .expand{font-size:11px;padding:7px 9px}
  .official{width:100%;margin-left:0;text-align:center}
}
@media(max-width:390px){
  h1{font-size:29px}
  .card-head{align-items:flex-start}
  .category{font-size:9px}
}
</style>

</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="eyebrow">MNP SUPPORT DATABASE</div>
      <div class="hero-badge">Spreadsheet Sync Ready</div>
    </div>
    <div class="hero-grid">
      <div>
        <h1>MNP予約番号<br>発行方法一覧</h1>
        <p class="lead">キャリア名、電話番号、発行時間、エラー内容、関連サービスから検索できます。データはGoogleスプレッドシートから追加・更新できます。</p>
      </div>
      <div class="hero-stat">
        <strong id="heroCount">—</strong>
        <span>公開キャリアを掲載中</span>
      </div>
    </div>
  </div>
</header>

<div class="search-area">
  <div class="search-row">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="例：docomo、151、パケットシェア、SMS、3営業日">
      <button class="clear" id="clear" aria-label="検索をクリア">×</button>
    </div>
    <div class="count" id="count">読み込み中…</div>
  </div>
</div>

<main>
  <div class="error" id="error"></div>
  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <p class="sync" id="sync">データを読み込んでいます</p>
  </div>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty">一致するキャリア・項目が見つかりませんでした。</div>
</main>

<footer>契約状態や各社の画面変更により手順が異なる場合があります。最終判断は各社公式情報をご確認ください。</footer>

const state={all:[],query:"",category:"すべて"};
const $=s=>document.querySelector(s);
const esc=(s="")=>String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const norm=v=>String(v??"").toLowerCase().normalize("NFKC");

function dateLabel(v){
  if(!v)return "未確認";
  const d=new Date(v);
  return Number.isNaN(d.getTime())?v:d.toLocaleDateString("ja-JP");
}
function highlight(text,q){
  const safe=esc(text||"");
  if(!q)return safe;
  const words=q.trim().split(/\s+/).filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return words.length?safe.replace(new RegExp(`(${words.join("|")})`,"gi"),"<mark>$1</mark>"):safe;
}
function rich(text,q){
  if(!text)return "";
  let html="",listOpen=false;
  const close=()=>{if(listOpen){html+="</ul>";listOpen=false;}};
  String(text).split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line)return;
    if(line.startsWith("##")){
      close(); html+=`<h4>${highlight(line.replace(/^##\s*/,""),q)}</h4>`;
    }else if(line.startsWith("・")){
      if(!listOpen){html+="<ul>";listOpen=true;}
      html+=`<li>${highlight(line.slice(1).trim(),q)}</li>`;
    }else if(line.startsWith("※")){
      close(); html+=`<div class="notice"><b>注意</b>${highlight(line.slice(1).trim(),q)}</div>`;
    }else if(line.startsWith("【重要】")){
      close(); html+=`<div class="important"><b>重要</b>${highlight(line.replace(/^【重要】\s*/,""),q)}</div>`;
    }else{
      close(); html+=`<p>${highlight(line,q)}</p>`;
    }
  });
  close(); return html;
}
function section(title,text,q){
  if(!text)return "";
  return `<section class="section"><h3 class="section-title">${esc(title)}</h3><div class="rich">${rich(text,q)}</div></section>`;
}
function logoHtml(item){
  const fallback=esc((item.carrier||"?").slice(0,2));
  if(!item.logoUrl)return `<span class="logo-fallback">${fallback}</span>`;
  return `<img class="logo" src="${esc(item.logoUrl)}" alt="${esc(item.carrier)} ロゴ" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback',textContent:'${fallback}'}))">`;
}
function card(item,index){
  const q=state.query;
  return `<article class="card" id="card-${index}">
    <div class="card-head">
      <div class="logo-wrap">${logoHtml(item)}</div>
      <div class="title-area">
        <h2 class="carrier">${highlight(item.carrier,q)}</h2>
        <span class="category">${esc(item.category||"その他")}</span>
      </div>
      <div class="card-actions"><button class="expand" data-target="card-${index}">詳細</button></div>
    </div>
    <div class="card-body">
      <div class="summary-grid">
        <div class="summary-box is-primary is-method"><div class="summary-label">発行方法</div><div class="summary-text">${highlight(item.webAvailable||item.phoneAvailable,q)}</div></div>
        <div class="summary-box"><div class="summary-label">発行目安</div><div class="summary-text">${highlight(item.timing,q)}</div></div>
        ${item.phone?`<div class="summary-box is-primary is-contact"><div class="summary-label">窓口</div><div class="summary-text">${highlight(item.phone,q)}</div></div>`:""}
        <div class="summary-box"><div class="summary-label">重要</div><div class="summary-text">${highlight(item.important,q)}</div></div>
      </div>
      <div class="detail">
        ${section("Web発行",item.webAvailable,q)}
        ${section("Web手順",item.webSteps,q)}
        ${section("電話発行",item.phoneAvailable,q)}
        ${section("電話手順",item.phoneSteps,q)}
        ${section("事前確認",item.precheck,q)}
        ${section("発行不可・対象外",item.unavailable,q)}
        ${section("トラブル対応",item.trouble,q)}
        ${section("関連サービス・回線",item.related,q)}
        ${item.fieldNote?`<div class="notice"><b>現場補足・要確認</b>${highlight(item.fieldNote,q)}</div>`:""}
        ${item.important?`<div class="important"><b>重要</b>${highlight(item.important,q)}</div>`:""}
        ${item.note?`<div class="notice"><b>注意</b>${highlight(item.note,q)}</div>`:""}
        <div class="meta">
          <span>最終確認：${esc(dateLabel(item.checked))}</span>
          ${item.url?`<a class="official" href="${esc(item.url)}" target="_blank" rel="noopener">公式情報を見る ↗</a>`:""}
        </div>
      </div>
    </div>
  </article>`;
}
function renderFilters(){
  const cats=["すべて",...new Set(state.all.map(x=>x.category).filter(Boolean))];
  $("#filters").innerHTML=cats.map(c=>`<button class="chip ${state.category===c?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;renderFilters();render();});
}
function render(){
  const words=norm(state.query).split(/\s+/).filter(Boolean);
  const filtered=state.all.filter(item=>{
    if(item.status&&item.status!=="公開")return false;
    if(state.category!=="すべて"&&item.category!==state.category)return false;
    const hay=norm(Object.values(item).join(" "));
    return words.every(w=>hay.includes(w));
  });
  $("#grid").innerHTML=filtered.map(card).join("");
  $("#grid").style.display=filtered.length?"grid":"none";
  $("#empty").style.display=filtered.length?"none":"block";
  const total=state.all.filter(x=>!x.status||x.status==="公開").length;
  $("#count").textContent=`${filtered.length}件表示 / 全${total}件`;
  const heroCount=document.getElementById("heroCount");
  if(heroCount)heroCount.textContent=total;
  $("#clear").style.display=state.query?"block":"none";
  document.querySelectorAll(".expand").forEach(btn=>btn.onclick=()=>{
    const el=document.getElementById(btn.dataset.target);
    el.classList.toggle("open");
    btn.textContent=el.classList.contains("open")?"閉じる":"詳細";
  });
}
async function load(){
  try{
    let payload;
    if(APPS_SCRIPT_URL){
      const sep=APPS_SCRIPT_URL.includes("?")?"&":"?";
      const res=await fetch(`${APPS_SCRIPT_URL}${sep}t=${Date.now()}`,{cache:"no-store"});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      payload=await res.json();
      if(payload.error)throw new Error(payload.error);
    }else{
      payload={data:DEMO_DATA,updated:"デモデータ表示中"};
    }
    state.all=Array.isArray(payload)?payload:(payload.data||[]);
    renderFilters();render();
    $("#sync").textContent=APPS_SCRIPT_URL?`スプレッドシート同期：${payload.updated||new Date().toLocaleString("ja-JP")}`:"デモデータ表示中｜Apps Script URLを設定すると自動同期します";
  }catch(e){
    state.all=DEMO_DATA;renderFilters();render();
    $("#error").style.display="block";
    $("#error").textContent=`データ読み込みに失敗したためデモデータを表示しています。${e.message}`;
    $("#sync").textContent="デモデータ表示中";
  }
}
$("#search").addEventListener("input",e=>{state.query=e.target.value;render();});
$("#clear").addEventListener("click",()=>{$("#search").value="";state.query="";render();$("#search").focus();});
load();
</script>
